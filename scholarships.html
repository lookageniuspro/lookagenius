<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LookaGenius Academy | المنح الدراسية</title>
    
    <!-- SEO & Social Sharing (Open Graph) -->
    <meta name="description" content="البحث عن أفضل المنح الدراسية الممولة بالكامل في الجامعات الأوروبية. إرشاد أكاديمي متكامل للقبول.">
    <meta property="og:title" content="LookaGenius Academy | دليل المنح الدراسية">
    <meta property="og:description" content="منح Erasmus و DAAD والمزيد. احصل على دعمنا للالتحاق بأعرق الجامعات.">
    <meta property="og:image" content="assets/img/logo.png">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .scholarship-card .scholarship-img {
            width: 100%; height: 180px; object-fit: cover; border-radius: 16px; margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div id="global-nav"></div>
    <main id="app-container" style="padding-top: 120px;">
        <section class="section-container" data-aos="fade-up">
            <div class="section-header mb-4">
                <h1 style="font-size: clamp(28px, 5vw, 45px); font-weight: 800;">المنح الدراسية الأوروبية</h1>
                <p style="color: var(--text-secondary);">فرص حصرية للالتحاق بأعرق الجامعات العالمية بتمويل شامل</p>
            </div>

            <div class="subjects-grid" id="scholarshipsContainer">
                <!-- ريندر ديناميكي من db.js -->
            </div>

            <!-- Static fallback if JS disabled -->
            <noscript>
                <div class="subjects-grid">
                    <div class="subject-card hover-trigger"><h3>إيراسموس موندوس</h3><p>تمويل كامل + راتب شهري</p></div>
                    <div class="subject-card hover-trigger"><h3>منحة DAAD ألمانيا</h3><p>راتب شهري + تأمين صحي</p></div>
                </div>
            </noscript>
        </section>
    </main>

    <!-- Social Tools -->
    <div class="float-wrapper">
        <a href="#" class="float-btn telegram hover-trigger" title="قناة التليجرام للمنح"><i class="fa-brands fa-telegram"></i></a>
        <a href="https://wa.me/201098768356" class="float-btn whatsapp hover-trigger" target="_blank" title="تواصل عبر واتساب"><i class="fa-brands fa-whatsapp"></i></a>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/db.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/app.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('scholarshipsContainer');
            if (!container || typeof window.db === 'undefined') return;
            const scholarships = window.db.getScholarships();
            if (scholarships.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);"><i class="fa-solid fa-star" style="font-size:2rem;margin-bottom:15px;display:block;"></i><p>لا توجد منح حالياً. تابعنا قريباً!</p></div>';
                return;
            }
            container.innerHTML = scholarships.map((s, i) => `
                <div class="subject-card hover-trigger scholarship-card" data-aos="fade-up" data-aos-delay="${(i%3)*100}">
                    <img src="${s.image || 'https://images.unsplash.com/photo-1523050854058-8df90110c6f9?auto=format&fit=crop&w=400&q=80'}" alt="${s.title}" class="scholarship-img" onerror="this.style.display='none'">
                    <div style="display:flex; gap:12px; margin-bottom:12px;">
                        <i class="fa-solid fa-earth-europe" style="font-size:32px; color:var(--accent-violet);"></i>
                        <div><h3 style="color:#fff;">${s.title}</h3><p style="color:var(--primary-blue);">${s.university || s.country}</p></div>
                    </div>
                    <div class="subject-desc">
                        <i class="fa-solid fa-sack-dollar" style="color:var(--success);"></i> ${s.funding}<br>
                        <i class="fa-solid fa-calendar" style="color:var(--accent-pink);"></i> الموعد: ${s.deadline}
                    </div>
                    ${s.description ? `<p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; margin: 12px 0 20px;">${s.description}</p>` : ''}
                    <div style="display:flex; gap:10px;">
                        <a href="${s.link || '#'}" target="${s.link && s.link !== '#' ? '_blank' : '_self'}" class="btn btn-secondary" style="flex:1; justify-content: center;">تقديم الآن</a>
                        <a href="https://wa.me/201098768356?text=${encodeURIComponent('أريد استشارة عن منحة: ' + s.title)}" target="_blank" class="btn btn-primary" style="flex:1; justify-content: center; background:#25D366; border-color:#25D366; color:white;"><i class="fa-brands fa-whatsapp"></i> استشارة</a>
                    </div>
                </div>
            `).join('');
        });
    </script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/chatbot.js"></script>
</body>
</html>
