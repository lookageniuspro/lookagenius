    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        let regAvatarData = '';
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('regAvatar').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    regAvatarData = ev.target.result;
                    document.getElementById('regAvatarImg').src = regAvatarData;
                    document.getElementById('regAvatarPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            });

            const form = document.getElementById('regForm');
            if (form) {
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const userData = {
                        name: document.getElementById('regName').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPass').value,
                        type: document.getElementById('regType').value,
                        avatar: regAvatarData
                    };
                    const res = await window.auth.register(userData);
                    if (res.success) {
                        window.location.href = `dashboard-${res.user.type}.html`;
                    } else {
                        const err = document.getElementById('regErrorMsg');
                        err.textContent = res.message;
                        err.style.display = 'block';
                    }
                };
            }
        });
    </script>
