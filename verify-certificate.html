<title>LookaGenius | التحقق من الشهادة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="assets/css/anti-gravity.css">
    <meta name="description" content="التحقق من الشهادات - تحقق من صحة شهادات LookaGenius Academy برقم الشهادة">
</head>
<body class="dark-theme">
    <div id="global-nav"></div>
    <main style="min-height:80vh;padding:40px 20px;display:flex;align-items:center;justify-content:center;">
        <div class="dash-card" style="max-width:600px;width:100%;text-align:center;padding:50px 30px;">
            <div id="loadingState">
                <div style="font-size:3rem;color:#00D4FF;margin-bottom:20px;"><i class="fa-solid fa-spinner fa-spin"></i></div>
                <p>جاري التحقق من الشهادة...</p>
            </div>
            <div id="validState" style="display:none;">
                <div style="font-size:4rem;color:#10b981;margin-bottom:20px;"><i class="fa-solid fa-check-circle"></i></div>
                <h3 style="font-size:1.5rem;font-weight:900;color:#10b981;margin-bottom:10px;">شهادة صالحة ✓</h3>
                <div id="certDetails" style="text-align:right;background:rgba(255,255,255,0.03);border-radius:16px;padding:25px;margin:20px 0;">
                    <p style="margin:8px 0;"><strong>الطالب:</strong> <span id="vStudent" style="color:#00D4FF;"></span></p>
                    <p style="margin:8px 0;"><strong>الكورس:</strong> <span id="vCourse" style="color:#A855F7;"></span></p>
                    <p style="margin:8px 0;"><strong>رمز الشهادة:</strong> <span id="vCode" style="color:#FBBF24;"></span></p>
                    <p style="margin:8px 0;"><strong>تاريخ الإصدار:</strong> <span id="vDate" style="color:rgba(255,255,255,0.5);"></span></p>
                </div>
                <div style="margin-top:20px;">
                    <a href="dashboard-student.html" class="ag-btn" style="display:inline-flex;padding:12px 30px;text-decoration:none;"><i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم</a>
                </div>
            </div>
            <div id="invalidState" style="display:none;">
                <div style="font-size:4rem;color:#ff4d4d;margin-bottom:20px;"><i class="fa-solid fa-times-circle"></i></div>
                <h3 style="font-size:1.5rem;font-weight:900;color:#ff4d4d;margin-bottom:10px;">شهادة غير صالحة ✗</h3>
                <p style="color:rgba(255,255,255,0.5);">لم يتم العثور على هذه الشهادة في سجلاتنا. يرجى التأكد من رمز الشهادة.</p>
            </div>
        </div>
    </main>
    <div id="global-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/db.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/app.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search)
            const code = params.get('code')
            if (!code) {
                document.getElementById('loadingState').style.display = 'none'
                document.getElementById('invalidState').style.display = 'block'
                document.querySelector('#invalidState h3').textContent = 'رمز غير موجود'
                document.querySelector('#invalidState p').textContent = 'يرجى استخدام رابط التحقق الكامل الموجود على الشهادة.'
                return
            }
            try {
                const sb = window.supabaseApp
                if (sb && sb.isReady()) {
                    const { data, error } = await sb.client.from('certificates')
                        .select('*, courses(title), profiles(full_name)')
                        .eq('certificate_code', code)
                        .maybeSingle()
                    if (data) {
                        document.getElementById('loadingState').style.display = 'none'
                        document.getElementById('validState').style.display = 'block'
                        document.getElementById('vStudent').textContent = data.profiles?.full_name || '—'
                        document.getElementById('vCourse').textContent = data.courses?.title || '—'
                        document.getElementById('vCode').textContent = data.certificate_code || code
                        document.getElementById('vDate').textContent = data.issue_date ? new Date(data.issue_date).toLocaleDateString('ar') : '—'
                    } else {
                        document.getElementById('loadingState').style.display = 'none'
                        document.getElementById('invalidState').style.display = 'block'
                    }
                } else {
                    document.getElementById('loadingState').style.display = 'none'
                    document.getElementById('invalidState').style.display = 'block'
                    document.querySelector('#invalidState p').textContent = 'خدمة التحقق غير متاحة حالياً. يرجى المحاولة لاحقاً.'
                }
            } catch(e) {
                document.getElementById('loadingState').style.display = 'none'
                document.getElementById('invalidState').style.display = 'block'
            }
        })
    </script>
</body>
</html>
