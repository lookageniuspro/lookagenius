<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LookaGenius | لوحة تحكم الطالب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050a14;
            --neon-blue: #00D4FF;
            --neon-violet: #A855F7;
            --neon-pink: #FF3366;
            --success: #00FFAA;
            --warning: #FBBF24;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.07);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --sidebar-width: 250px;
            --font-main: 'Tajawal', sans-serif;
            --font-heading: 'Cairo', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.06), transparent 45%),
                        radial-gradient(circle at 85% 70%, rgba(168, 85, 247, 0.06), transparent 50%);
            z-index: -2; pointer-events: none;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

        .sidebar {
            width: var(--sidebar-width);
            background: rgba(5, 5, 15, 0.9);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--border-color);
            padding: 0;
            position: fixed;
            inset-block: 0; inset-inline-start: 0;
            display: flex; flex-direction: column;
            z-index: 100; overflow-y: auto;
        }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .sidebar-header .logo-img { height: 50px; width: auto; margin-bottom: 8px; }
        .sidebar-header .logo-text {
            font-size: 1.2rem; font-weight: 900;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            display: block;
        }
        .sidebar-header .student-badge {
            display: inline-block; background: linear-gradient(135deg, var(--success), var(--neon-blue));
            color: white; padding: 2px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 5px;
        }
        .sidebar-user {
            display: flex; align-items: center; gap: 10px; padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-user img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon-blue); }
        .sidebar-user .user-name { font-weight: 700; font-size: 0.85rem; }
        .sidebar-user .user-role { font-size: 0.7rem; color: var(--text-secondary); }
        .nav-menu { list-style: none; padding: 10px 12px; flex-grow: 1; }
        .nav-item { margin-bottom: 2px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; color: var(--text-secondary);
            text-decoration: none; padding: 10px 16px; border-radius: 10px;
            transition: 0.3s; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; border: none; background: none; width: 100%;
            text-align: start; font-family: var(--font-main); position: relative;
        }
        .nav-link:hover { background: var(--glass); color: var(--neon-blue); }
        .nav-link.active { background: rgba(0, 212, 255, 0.08); color: var(--neon-blue); border: 1px solid rgba(0, 212, 255, 0.1); }
        .nav-link i { width: 20px; text-align: center; font-size: 1rem; }
        .nav-link .notif-badge {
            position: absolute; inset-inline-end: 12px; background: var(--neon-pink);
            color: white; font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 700;
        }
        .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-color); }
        .sidebar-footer .nav-link { color: var(--neon-pink); }

        .sidebar-toggle {
            display: none; position: fixed; top: 12px; inset-inline-start: 12px;
            width: 42px; height: 42px; background: var(--glass); border: 1px solid var(--border-color);
            border-radius: 10px; color: white; font-size: 20px; z-index: 101;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.3s;
        }
        .sidebar-toggle:hover { border-color: var(--neon-blue); color: var(--neon-blue); }
        .sidebar-close-mobile { display: none; }

        .main-content { margin-inline-start: var(--sidebar-width); padding: 30px; width: 100%; min-height: 100vh; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .top-bar h1 { font-family: var(--font-heading); font-size: 1.5rem; }
        .top-bar h1 span { color: var(--neon-blue); }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card { background: var(--glass); backdrop-filter: blur(12px); padding: 22px; border-radius: 16px; border: 1px solid var(--border-color); transition: 0.3s; }
        .stat-card:hover { border-color: var(--neon-blue); transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 212, 255, 0.08); }
        .stat-card .stat-icon { font-size: 1.5rem; margin-bottom: 8px; }
        .stat-card .stat-number { font-size: 1.8rem; font-weight: 900; font-family: var(--font-heading); }
        .stat-card .stat-label { color: var(--text-secondary); font-size: 0.8rem; margin-top: 2px; }

        .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .course-card { background: var(--glass); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; transition: 0.3s; }
        .course-card:hover { border-color: var(--neon-blue); transform: translateY(-3px); box-shadow: 0 0 25px rgba(0, 212, 255, 0.08); }
        .course-card img { width: 100%; height: 160px; object-fit: cover; }
        .course-card-body { padding: 16px; }
        .course-card-body h4 { font-family: var(--font-heading); font-size: 1rem; margin-bottom: 6px; }
        .course-card-body p { color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .course-card-footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--border-color); }
        .course-card-footer .price { font-weight: 900; color: var(--success); font-size: 1.1rem; }
        .course-card-footer .badge { padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; background: rgba(0, 212, 255, 0.12); color: var(--neon-blue); }

        .table-container { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        thead { background: rgba(0, 212, 255, 0.03); border-bottom: 1px solid var(--border-color); }
        th { padding: 14px 18px; text-align: start; font-weight: 700; color: var(--neon-blue); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 12px 18px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }

        .ag-btn {
            padding: 9px 20px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet));
            color: white; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
            font-family: var(--font-main); font-size: 13px;
        }
        .ag-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 212, 255, 0.25); }
        .ag-btn-sm { padding: 6px 14px; font-size: 12px; }
        .ag-btn-outline { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); }
        .ag-btn-outline:hover { background: var(--neon-blue); color: #000; }
        .ag-btn-success { background: linear-gradient(135deg, var(--success), #059669); }
        .ag-btn-whatsapp { background: #25D366; }
        .ag-btn-whatsapp:hover { box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3); }

        .search-box { display: flex; align-items: center; gap: 10px; background: var(--glass); padding: 8px 16px; border-radius: 30px; border: 1px solid var(--border-color); flex: 1; max-width: 350px; }
        .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; font-family: var(--font-main); font-size: 0.85rem; }
        .search-box input::placeholder { color: var(--text-secondary); }

        .section-title { font-family: var(--font-heading); font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--neon-blue); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: var(--neon-blue); opacity: 0.5; }
        .empty-state h3 { font-family: var(--font-heading); margin-bottom: 8px; }

        @media (max-width: 992px) {
            .sidebar { width: 68px; }
            .sidebar .sidebar-header .logo-text, .sidebar .sidebar-header .student-badge, .sidebar-user .user-name, .sidebar-user .user-role, .sidebar .nav-link span, .sidebar-footer .nav-link span, .sidebar-close-mobile { display: none; }
            .sidebar .nav-link { justify-content: center; padding: 10px; }
            .sidebar .nav-link i { margin: 0; }
            .sidebar-user { justify-content: center; padding: 10px; }
            .sidebar-user img { width: 36px; height: 36px; }
            .main-content { margin-inline-start: 68px; padding: 20px; }
        }
        @media (max-width: 768px) {
            .sidebar-toggle { display: flex; }
            .sidebar-close-mobile { display: block !important; }
            .sidebar {
                width: 260px; inset-inline-start: -100%;
                transition: inset-inline-start 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 200;
                box-shadow: 0 0 30px rgba(0,0,0,0.5);
            }
            .sidebar.open { inset-inline-start: 0; }
            .sidebar .sidebar-header .logo-text, .sidebar .sidebar-header .student-badge, .sidebar-user .user-name, .sidebar-user .user-role, .sidebar .nav-link span, .sidebar-footer .nav-link span { display: block; }
            .sidebar .nav-link { justify-content: flex-start; padding: 10px 16px; }
            .sidebar .nav-link i { margin: 0 0 0 12px; }
            .sidebar-user { justify-content: flex-start; padding: 16px 20px; }
            .sidebar-user img { width: 42px; height: 42px; }
            .main-content { margin-inline-start: 0; padding: 16px; padding-top: 70px; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .course-grid { grid-template-columns: 1fr; }
            .search-box { max-width: 100%; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

    <aside class="sidebar" id="mainSidebar">
        <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;padding:15px 20px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <img src="assets/img/logo.png" alt="LG Logo" class="logo-img" style="height:40px;">
                <span class="logo-text" style="font-size:1rem;">LookaGenius</span>
            </div>
            <button id="sidebarCloseMobile" onclick="toggleSidebar()" style="background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;" class="sidebar-close-mobile"><i class="fa-solid fa-xmark"></i></button>
            <span class="student-badge" style="font-size:10px;">Student</span>
        </div>
        <div class="sidebar-user" id="sidebarUser">
            <img id="sdAvatar" src="https://ui-avatars.com/api/?name=Student&background=0D8ABC&color=fff&size=80" alt="Avatar">
            <div>
                <div class="user-name" id="sdUserName">Student</div>
                <div class="user-role" id="sdUserRole">طالب</div>
            </div>
        </div>
        <nav class="nav-menu">
            <div class="nav-item"><button class="nav-link active" data-page="dashboard"><i class="fa-solid fa-home"></i> <span>الرئيسية</span></button></div>
            <div class="nav-item"><button class="nav-link" data-page="courses"><i class="fa-solid fa-graduation-cap"></i> <span>تصفح الكورسات</span></button></div>
            <div class="nav-item"><button class="nav-link" data-page="mycourses"><i class="fa-solid fa-book-open"></i> <span>كورساتي</span></button></div>
            <div class="nav-item"><button class="nav-link" data-page="cart"><i class="fa-solid fa-cart-shopping"></i> <span>سلة المشتريات</span> <span class="notif-badge" id="cartBadge" style="display:none;">0</span></button></div>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-link" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user-gear"></i> <span>الملف الشخصي</span></button>
            <button class="nav-link" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> <span>تسجيل الخروج</span></button>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <h1 id="pageTitle"><span>LookaGenius</span> | لوحة تحكم الطالب</h1>
            <div style="display:flex;align-items:center;gap:10px;">
                <span id="sdGreeting" style="font-size:0.9rem;color:var(--text-secondary);"></span>
            </div>
        </div>

        <section class="page-section active" id="page-dashboard">
            <div class="stats-grid" id="sdStatsGrid">
                <div class="stat-card"><div class="stat-icon" style="color:var(--neon-blue);"><i class="fa-solid fa-book-open"></i></div><div class="stat-number" id="sdEnrolledCount">0</div><div class="stat-label">الكورسات المسجلة</div></div>
                <div class="stat-card"><div class="stat-icon" style="color:var(--success);"><i class="fa-solid fa-cart-shopping"></i></div><div class="stat-number" id="sdCartCount">0</div><div class="stat-label">في سلة المشتريات</div></div>
                <div class="stat-card"><div class="stat-icon" style="color:var(--neon-violet);"><i class="fa-solid fa-chart-line"></i></div><div class="stat-number" id="sdProgressAvg">0%</div><div class="stat-label">متوسط التقدم</div></div>
            </div>
            <div class="table-container" style="padding:20px;">
                <div class="section-title"><i class="fa-solid fa-clock"></i> أحدث كورساتي</div>
                <div id="sdRecentCourses"><div class="empty-state"><i class="fa-solid fa-book"></i><h3>لم تسجل في أي كورس بعد</h3><p>تصفح الكورسات المتاحة وابدأ رحلة التعلم!</p><button class="ag-btn" onclick="switchPage('courses')" style="margin-top:10px;"><i class="fa-solid fa-search"></i> تصفح الكورسات</button></div></div>
            </div>
        </section>

        <section class="page-section" id="page-courses">
            <div class="section-title"><i class="fa-solid fa-search"></i> تصفح الكورسات</div>
            <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
                <div class="search-box"><input type="text" id="sdCourseSearch" placeholder="ابحث عن كورس..." oninput="renderBrowseCourses()"><i class="fa-solid fa-search" style="color:var(--text-secondary);"></i></div>
                <select id="sdCategoryFilter" onchange="renderBrowseCourses()" style="padding:8px 14px;background:var(--glass);border:1px solid var(--border-color);border-radius:30px;color:white;font-family:var(--font-main);">
                    <option value="all">كل التصنيفات</option>
                </select>
            </div>
            <div class="course-grid" id="sdCourseGrid"></div>
        </section>

        <section class="page-section" id="page-mycourses">
            <div class="section-title"><i class="fa-solid fa-book-open"></i> كورساتي المسجلة</div>
            <div class="course-grid" id="sdMyCoursesGrid"></div>
        </section>

        <section class="page-section" id="page-cart">
            <div class="section-title"><i class="fa-solid fa-cart-shopping"></i> سلة المشتريات</div>
            <div class="table-container" style="padding:20px;">
                <div id="sdCartContent"></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/db-sync.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mock-api.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/chatbot.js"></script>
    <script src="js/pages/dashboard-student.js"></script>
</body>
</html>
